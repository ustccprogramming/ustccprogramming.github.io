[project]
site_name = "CS1003.05 计算机程序设计"
site_description = "中国科学技术大学 CS1003.05 计算机程序设计参考答案"
site_url = "https://ustccprogramming.github.io/"
repo_url = "https://github.com/ustccprogramming/ustccprogramming.github.io"
repo_name = "ustccprogramming.github.io"
copyright = "中国科学技术大学 CS1003.05 计算机程序设计"

nav = [
  { "首页" = "index.md" },
  { "参考答案" = "blog/index.md" },
  { "发布答案" = "guide/publish.md" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
language = "zh"
font = false
favicon = "images/logo.svg"
logo = "images/logo.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "blue"
accent = "deep-orange"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "切换到跟随系统"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ustccprogramming/ustccprogramming.github.io"

# 保留中文标题锚点。不写这段时，纯中文标题会被收成 _1、_2。
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.toc.slugify]
object = "pymdownx.slugs.slugify"

[project.markdown_extensions.toc.slugify.kwds]
case = "lower"

# 答案是博客文章：新建 docs/blog/posts/*.md 即会出现在「参考答案」。
[project.plugins.blog]
post_url_format = "{file}"
post_date_format = "yyyy年M月d日"
archive_date_format = "yyyy年"
post_excerpt_separator = "<!-- more -->"
pagination_per_page = 10
categories_allowed = ["实验", "作业", "公告"]
